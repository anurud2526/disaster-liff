<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>แจ้งเหตุสาธารณภัย</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Sarabun,sans-serif;background:#f4f6f8;color:#222;padding:16px;padding-bottom:40px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
h2{font-size:19px;margin-bottom:4px}
.sub{font-size:13px;color:#777;margin-bottom:14px}
#gps{font-size:13px;padding:10px 12px;border-radius:10px;background:#fff8e1;color:#8d6e00;margin-bottom:14px}
#gps.ok{background:#e8f5e9;color:#1b5e20}
#gps.err{background:#ffebee;color:#b71c1c}
.sos{width:100%;padding:26px;font-size:26px;font-weight:700;color:#fff;border:none;border-radius:20px;
     background:linear-gradient(145deg,#e53935,#b71c1c);box-shadow:0 8px 22px rgba(198,40,40,.45);
     font-family:inherit;cursor:pointer;transition:.15s}
.sos:active{transform:scale(.97)}
.sos:disabled{background:#bdbdbd;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.t{padding:14px 4px;border:2px solid #e0e0e0;border-radius:14px;background:#fff;text-align:center;
   font-size:13px;font-family:inherit;cursor:pointer}
.t.on{border-color:#c62828;background:#ffebee;font-weight:700}
.t .e{display:block;font-size:26px;margin-bottom:4px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d5d5d5;border-radius:10px;
  font-family:inherit;font-size:15px;margin-top:8px}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:#1b3a57;color:#fff;
  font-size:16px;font-weight:600;font-family:inherit;margin-top:14px;cursor:pointer}
.hide{display:none}
.ok-box{text-align:center;padding:30px 16px}
.ok-box .big{font-size:56px}
.cid{font-size:22px;font-weight:700;color:#c62828;margin:10px 0}
</style>
</head>
<body>

<!-- ═══ หน้าประชาชน ═══ -->
<div id="pageReport" class="hide">
  <div class="card">
    <h2>🆘 แจ้งเหตุสาธารณภัย</h2>
    <div class="sub" id="hello">กำลังเชื่อมต่อ...</div>
    <div id="gps">📡 กำลังระบุตำแหน่ง...</div>
    <button class="sos" id="btnSos" disabled onclick="send()">🚨 กดแจ้งเหตุ</button>
  </div>

  <div class="card">
    <b style="font-size:15px">ประเภทเหตุ <span style="color:#999;font-weight:400">(ไม่เลือกก็ส่งได้)</span></b>
    <div class="grid" id="types"></div>
    <input id="phone" type="tel" placeholder="เบอร์ติดต่อกลับ (ถ้ามี)">
    <textarea id="detail" rows="2" placeholder="รายละเอียดเพิ่มเติม"></textarea>
  </div>
</div>

<!-- ═══ หน้าเจ้าหน้าที่รายงานผล ═══ -->
<div id="pageResult" class="hide">
  <div class="card">
    <h2>📝 รายงานผลการดำเนินการ</h2>
    <div class="sub" id="caseInfo">กำลังโหลด...</div>
    <select id="rs">
      <option value="">— เลือกผลการดำเนินการ —</option>
      <option>ระงับเหตุได้</option>
      <option>ขอกำลังสนับสนุน</option>
      <option>ไม่พบเหตุ (แจ้งเท็จ)</option>
      <option>ส่งต่อหน่วยงานอื่น</option>
      <option>อยู่ระหว่างดำเนินการ</option>
    </select>
    <textarea id="rn" rows="3" placeholder="หมายเหตุ / ความเสียหาย / กำลังพลที่ใช้"></textarea>
    <button class="btn" onclick="sendResult()">✅ ส่งรายงาน</button>
  </div>
</div>

<!-- ═══ หน้าสำเร็จ ═══ -->
<div id="pageDone" class="hide">
  <div class="card ok-box">
    <div class="big">✅</div>
    <h2 id="doneTitle">ส่งข้อมูลสำเร็จ</h2>
    <div class="cid" id="doneCase"></div>
    <div class="sub" id="doneMsg"></div>
    <button class="btn" onclick="liff.closeWindow()">ปิดหน้าต่าง</button>
  </div>
</div>

<script>
const LIFF_ID = 2011403604-LAlVIDfS;
const API     = https://script.google.com/macros/s/AKfycbznTEvjPJRj7foUQykyOfXSGAuUeURmc6lZD5DNgqcFh9oqMzMufFsfKHbHdK1B21q4/exec;

const TYPES = [
  {e:'🔥',n:'ไฟไหม้'},   {e:'🌊',n:'น้ำท่วม'},   {e:'🌪️',n:'วาตภัย'},
  {e:'⛰️',n:'ดินถล่ม'},  {e:'🚗',n:'อุบัติเหตุ'}, {e:'🚑',n:'เจ็บป่วยฉุกเฉิน'},
  {e:'⚡',n:'ไฟฟ้า/สายสื่อสาร'}, {e:'🐍',n:'สัตว์อันตราย'}, {e:'⚠️',n:'อื่นๆ'}
];

let pos = null, picked = '', profile = {}, caseId = '';

/* ── เรนเดอร์ปุ่มประเภทภัย ── */
document.getElementById('types').innerHTML = TYPES.map((t,i) =>
  '<button class="t" onclick="pick(' + i + ',this)"><span class="e">' + t.e + '</span>' + t.n + '</button>').join('');
function pick(i, el){
  document.querySelectorAll('.t').forEach(b => b.classList.remove('on'));
  if (picked === TYPES[i].n){ picked = ''; return; }
  picked = TYPES[i].n; el.classList.add('on');
}

function show(id){ ['pageReport','pageResult','pageDone'].forEach(p =>
  document.getElementById(p).classList.toggle('hide', p !== id)); }

async function post(payload){
  const r = await fetch(API, { method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return r.json();
}

/* ── เริ่มระบบ ── */
liff.init({ liffId: LIFF_ID }).then(async () => {
  if (!liff.isLoggedIn()) return liff.login();
  profile = await liff.getProfile();

  const p = new URLSearchParams(location.search);
  if (p.get('p') === 'result'){
    caseId = p.get('case') || '';
    show('pageResult');
    const r = await post({ action:'case', caseId });
    document.getElementById('caseInfo').textContent = r.ok
      ? r.data.caseId + ' · ' + r.data.type + ' · ' + (r.data.address || '')
      : 'ไม่พบเคส ' + caseId;
    return;
  }

  show('pageReport');
  document.getElementById('hello').textContent = 'สวัสดีคุณ ' + profile.displayName;
  locate();
}).catch(e => alert('LIFF error: ' + e));

/* ── จับพิกัด ── */
function locate(){
  const g = document.getElementById('gps');
  if (!navigator.geolocation){ g.className='err'; g.textContent='❌ อุปกรณ์ไม่รองรับ GPS'; return; }
  navigator.geolocation.getCurrentPosition(
    p => {
      pos = p.coords;
      g.className = 'ok';
      g.textContent = '✅ ระบุตำแหน่งแล้ว (ความแม่นยำ ±' + Math.round(pos.accuracy) + ' ม.)';
      document.getElementById('btnSos').disabled = false;
    },
    e => {
      g.className = 'err';
      g.innerHTML = '❌ ระบุตำแหน่งไม่ได้: ' + e.message +
        '<br>กรุณาเปิด GPS แล้ว <b onclick="locate()" style="text-decoration:underline">ลองอีกครั้ง</b>';
    },
    { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
  );
}

/* ── ส่งแจ้งเหตุ ── */
async function send(){
  if (!pos) return alert('ยังไม่ได้พิกัด');
  const b = document.getElementById('btnSos');
  b.disabled = true; b.textContent = '⏳ กำลังส่ง...';
  try{
    const r = await post({
      action:'report', userId:profile.userId, displayName:profile.displayName,
      lat:pos.latitude, lng:pos.longitude, accuracy:Math.round(pos.accuracy),
      type: picked || 'ไม่ระบุ',
      phone: document.getElementById('phone').value.trim(),
      detail: document.getElementById('detail').value.trim()
    });
    if (!r.ok) throw new Error(r.error);
    document.getElementById('doneCase').textContent = r.caseId;
    document.getElementById('doneMsg').textContent = 'แจ้งเจ้าหน้าที่เรียบร้อยแล้ว\n' + (r.address||'');
    show('pageDone');
    setTimeout(() => liff.closeWindow(), 5000);
  }catch(err){
    alert('ส่งไม่สำเร็จ: ' + err.message);
    b.disabled = false; b.textContent = '🚨 กดแจ้งเหตุ';
  }
}

/* ── เจ้าหน้าที่ส่งผล ── */
async function sendResult(){
  const rs = document.getElementById('rs').value;
  if (!rs) return alert('กรุณาเลือกผลการดำเนินการ');
  const r = await post({ action:'result', caseId, result:rs,
    note: document.getElementById('rn').value.trim(), by: profile.displayName });
  if (!r.ok) return alert('ผิดพลาด: ' + r.error);
  document.getElementById('doneTitle').textContent = 'บันทึกผลเรียบร้อย';
  document.getElementById('doneCase').textContent = caseId;
  document.getElementById('doneMsg').textContent = 'ใช้เวลาดำเนินการ ' + r.minutes + ' นาที';
  show('pageDone');
  setTimeout(() => liff.closeWindow(), 3000);
}
</script>
</body>
</html>
